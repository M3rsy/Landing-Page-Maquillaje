<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JRV Admin — Acceso</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose:     #b11f55;
      --rose-dk:  #761436;
      --rose-lt:  #f7d0de;
      --gold:     #b9862f;
      --ink:      #2a151b;
      --muted:    #7a5060;
      --border:   #f0d8e0;
      --surface:  #ffffff;
      --bg:       #fff7f8;
      --error:    #c0392b;
      --ease:     cubic-bezier(.4,0,.2,1);
    }

    html, body { height: 100%; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      min-height: 100vh;
    }

    /* ══════════════════════════════════
       LEFT PANEL — Brand
    ══════════════════════════════════ */
    .brand-panel {
      flex: 0 0 46%;
      background: linear-gradient(150deg, #761436 0%, #b11f55 55%, #5a1028 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2.5rem;
      color: #fff;
    }

    /* Decorative blobs */
    .brand-panel::before,
    .brand-panel::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      opacity: .12;
      pointer-events: none;
    }
    .brand-panel::before {
      width: 520px; height: 520px;
      background: #fff;
      top: -160px; left: -160px;
    }
    .brand-panel::after {
      width: 340px; height: 340px;
      background: var(--gold);
      bottom: -110px; right: -90px;
    }

    /* Decorative floating circles */
    .deco-circles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .deco-circle {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,.15);
    }
    .deco-circle:nth-child(1) { width:180px; height:180px; top:12%; right:8%; }
    .deco-circle:nth-child(2) { width: 80px; height: 80px;  top:55%; right:22%; border-color:rgba(185,134,47,.3); }
    .deco-circle:nth-child(3) { width:260px; height:260px; bottom:-80px; left:-60px; border-color:rgba(255,255,255,.08);}
    .deco-circle:nth-child(4) { width: 40px; height: 40px;  top:32%; left:14%; border-color:rgba(255,255,255,.2); }

    /* Gold divider line */
    .brand-divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 1.1rem auto;
    }

    /* JRV SVG logo (inline) */
    .brand-logo-wrap {
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .brand-logo-wrap svg {
      width: 210px;
      height: auto;
      filter: brightness(0) invert(1);
      opacity: .92;
    }

    .brand-tagline {
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .brand-tagline h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: .05em;
      text-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .brand-tagline p {
      font-size: .88rem;
      opacity: .75;
      margin-top: .4rem;
      letter-spacing: .03em;
    }

    /* Testimonial quote */
    .brand-quote {
      position: relative;
      z-index: 1;
      margin-top: 2.5rem;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      border-left: 3px solid var(--gold);
      border-radius: 10px;
      padding: 1.1rem 1.3rem;
      max-width: 320px;
      backdrop-filter: blur(4px);
    }
    .brand-quote p {
      font-size: .82rem;
      line-height: 1.6;
      opacity: .88;
      font-style: italic;
    }
    .brand-quote span {
      display: block;
      margin-top: .6rem;
      font-size: .75rem;
      opacity: .6;
      font-style: normal;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    /* Dot indicators */
    .brand-dots {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: .45rem;
    }
    .brand-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,.35);
    }
    .brand-dots span.active { background: var(--gold); width: 20px; border-radius: 99px; }

    /* ══════════════════════════════════
       RIGHT PANEL — Form
    ══════════════════════════════════ */
    .form-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 2rem;
      animation: fadeSlideIn .5s var(--ease) both;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .form-inner {
      width: 100%;
      max-width: 380px;
    }

    .form-header {
      margin-bottom: 2.2rem;
    }
    .form-header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.2;
    }
    .form-header h1 span { color: var(--rose); }
    .form-header p {
      margin-top: .5rem;
      font-size: .88rem;
      color: var(--muted);
    }

    /* ── Floating label inputs ── */
    .float-field {
      position: relative;
      margin-bottom: 1.4rem;
    }

    .float-field input {
      width: 100%;
      height: 54px;
      padding: 18px 14px 6px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: .95rem;
      font-family: inherit;
      color: var(--ink);
      background: var(--surface);
      outline: none;
      transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
    }

    /* Password field has extra right padding for the toggle */
    .float-field.has-toggle input { padding-right: 48px; }

    .float-field input:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px rgba(177,31,85,.1);
    }

    .float-field label {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: .95rem;
      color: var(--muted);
      pointer-events: none;
      transition: top .18s var(--ease), font-size .18s var(--ease), color .18s var(--ease);
      background: transparent;
    }

    /* Float up when input has value or is focused */
    .float-field input:focus + label,
    .float-field input:not(:placeholder-shown) + label {
      top: 10px;
      transform: none;
      font-size: .72rem;
      color: var(--rose);
      font-weight: 600;
    }

    /* Hide the placeholder visually (needed for :not(:placeholder-shown) to work) */
    .float-field input::placeholder { color: transparent; }

    /* Toggle eye button */
    .toggle-eye {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 4px;
      transition: color .15s;
    }
    .toggle-eye:hover { color: var(--rose); }
    .toggle-eye svg { width: 20px; height: 20px; }

    /* ── Error message ── */
    .error-banner {
      display: flex;
      align-items: center;
      gap: .6rem;
      background: #fdecea;
      border: 1px solid #f5c6c2;
      border-radius: 8px;
      padding: .75rem 1rem;
      margin-bottom: 1.2rem;
      color: var(--error);
      font-size: .85rem;
      animation: shakeX .4s var(--ease);
    }

    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .error-banner svg { flex-shrink: 0; width: 18px; height: 18px; }

    /* ── Submit button ── */
    .btn-login {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dk) 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .03em;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: opacity .2s, transform .15s var(--ease), box-shadow .2s;
      box-shadow: 0 4px 16px rgba(177,31,85,.3);
    }
    .btn-login:hover:not(:disabled) {
      opacity: .93;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(177,31,85,.38);
    }
    .btn-login:active:not(:disabled) { transform: translateY(0); }
    .btn-login:disabled { opacity: .7; cursor: not-allowed; transform: none; }

    /* Ripple shine on click */
    .btn-login::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform .4s;
    }
    .btn-login:hover::after { transform: translateX(100%); }

    /* Loading state */
    .btn-login .spinner {
      display: none;
      width: 20px; height: 20px;
      border: 2.5px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto;
    }
    .btn-login.loading .btn-text { display: none; }
    .btn-login.loading .spinner  { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer note ── */
    .form-footer {
      margin-top: 1.8rem;
      text-align: center;
      font-size: .78rem;
      color: var(--muted);
    }
    .form-footer a {
      color: var(--rose);
      text-decoration: none;
      font-weight: 600;
    }
    .form-footer a:hover { text-decoration: underline; }

    /* ══════════════════════════════════
       RESPONSIVE — mobile stack
    ══════════════════════════════════ */
    @media (max-width: 720px) {
      body { flex-direction: column; }

      .brand-panel {
        flex: 0 0 auto;
        padding: 2.5rem 1.5rem 2rem;
        min-height: auto;
      }
      .brand-panel::before { width: 300px; height: 300px; top: -100px; left: -100px; }
      .brand-quote { display: none; }
      .brand-dots  { display: none; }

      .form-panel {
        flex: 1;
        padding: 2rem 1.5rem;
        animation: none;
      }
    }
  </style>
</head>
<body>

  <!-- ── Left: Brand panel ── -->
  <aside class="brand-panel">
    <div class="deco-circles" aria-hidden="true">
      <div class="deco-circle"></div>
      <div class="deco-circle"></div>
      <div class="deco-circle"></div>
      <div class="deco-circle"></div>
    </div>

    <div class="brand-logo-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" role="img" aria-label="JOYERIA JRV">
        <g fill="currentColor">
          <text x="260" y="108" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="118" font-weight="900">JRV</text>
          <text x="260" y="138" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" letter-spacing="1">JOYERIA JRV</text>
        </g>
      </svg>
    </div>

    <div class="brand-divider" aria-hidden="true"></div>

    <div class="brand-tagline">
      <h2>Panel de Administración</h2>
      <p>Gestiona tu catálogo de belleza</p>
    </div>

    <div class="brand-quote" aria-hidden="true">
      <p>"La belleza es poder; una sonrisa es su espada."</p>
      <span>— John Ray</span>
    </div>

    <div class="brand-dots" aria-hidden="true">
      <span class="active"></span>
      <span></span>
      <span></span>
    </div>
  </aside>

  <!-- ── Right: Form panel ── -->
  <main class="form-panel">
    <div class="form-inner">

      <div class="form-header">
        <h1>Bienvenida <span>de vuelta</span> 👋</h1>
        <p>Ingresa tus credenciales para acceder al panel.</p>
      </div>

      <div id="errorBanner" role="alert" hidden></div>

      <form id="loginForm" novalidate>

        <!-- Usuario -->
        <div class="float-field">
          <input
            id="usuario"
            name="usuario"
            type="text"
            autocomplete="username"
            placeholder="usuario"
            required
          />
          <label for="usuario">Usuario</label>
        </div>

        <!-- Contraseña -->
        <div class="float-field has-toggle">
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="contraseña"
            required
          />
          <label for="password">Contraseña</label>
          <button type="button" class="toggle-eye" id="togglePwd" aria-label="Mostrar contraseña">
            <!-- Eye open icon -->
            <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              <circle cx="12" cy="12" r="3" stroke-linecap="round"/>
            </svg>
            <!-- Eye closed icon (hidden by default) -->
            <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.477 10.477A3 3 0 0014.83 14.83M6.343 6.343A9.965 9.965 0 002.458 12C3.732 16.057 7.523 19 12 19a9.965 9.965 0 005.657-1.757M9.878 9.878A3 3 0 0114.12 14.12"/>
            </svg>
          </button>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text">Ingresar al panel</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

      </form>

      <p class="form-footer">
        ¿Necesitas ayuda? Contacta al <a href="https://wa.me/50488045356">administrador</a>.
      </p>

    </div>
  </main>

  <script>
    // ── Redirect si ya hay sesión ──
    if (localStorage.getItem("jrv_token")) {
      window.location.href = "dashboard.html";
    }

    // ── Toggle contraseña ──
    const pwdInput  = document.getElementById("password");
    const toggleBtn = document.getElementById("togglePwd");
    const eyeOpen   = document.getElementById("eyeOpen");
    const eyeClosed = document.getElementById("eyeClosed");

    toggleBtn.addEventListener("click", () => {
      const isHidden = pwdInput.type === "password";
      pwdInput.type = isHidden ? "text" : "password";
      eyeOpen.style.display   = isHidden ? "none"  : "";
      eyeClosed.style.display = isHidden ? ""      : "none";
      toggleBtn.setAttribute("aria-label", isHidden ? "Ocultar contraseña" : "Mostrar contraseña");
    });

    // ── Error banner ──
    function showError(msg) {
      const el = document.getElementById("errorBanner");
      el.innerHTML = `
        <div class="error-banner">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12" stroke-linecap="round"/>
            <line x1="12" y1="16" x2="12.01" y2="16" stroke-linecap="round"/>
          </svg>
          ${msg}
        </div>`;
      el.hidden = false;
    }

    function hideError() {
      const el = document.getElementById("errorBanner");
      el.hidden = true;
      el.innerHTML = "";
    }

    // ── Login ──
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError();

      const btn = document.getElementById("loginBtn");
      btn.classList.add("loading");
      btn.disabled = true;

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            usuario: document.getElementById("usuario").value.trim(),
            password: pwdInput.value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Credenciales incorrectas");

        localStorage.setItem("jrv_token",   data.token);
        localStorage.setItem("jrv_usuario", data.usuario);
        window.location.href = "dashboard.html";
      } catch (err) {
        showError(err.message);
        btn.classList.remove("loading");
        btn.disabled = false;
        pwdInput.value = "";
        pwdInput.focus();
      }
    });
  </script>
</body>
</html>
